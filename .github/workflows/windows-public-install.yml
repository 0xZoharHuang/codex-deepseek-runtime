name: Windows public release installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.6.14
      RELEASE_COMMIT: b1bda63015f594bcd88d78240217b21ff2d4f152
      RELEASE_MANIFEST_SHA256: d06e1700816818e61c53f2004b63574f961e1d2db65a00ed7c00173f99c5296e
      RELEASE_ARCHIVE_SHA256: 5672435dbc8673ff18213cb61fd4e3e7d0f52208c2aa364ea7c0cfb67e529328
      RELEASE_SOURCE_ID: b78fbc4332161ca41d7f
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.3"
          architecture: x64
      - name: Prepare verifier and anonymous consumer checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted Windows required' }
          $source = Join-Path $env:RUNNER_TEMP 'cds-public-tag'
          git -c credential.helper= -c core.autocrlf=false clone --depth 1 --branch $env:RELEASE_TAG https://github.com/0xZoharHuang/codex-deepseek-runtime.git $source
          python -m venv "$env:RUNNER_TEMP/cds-verifier"
          $python = "$env:RUNNER_TEMP/cds-verifier/Scripts/python.exe"
          & $python -I -m pip install --only-binary=:all: --require-hashes -r "$source/requirements.lock"
          & $python -I -m pip install --no-deps --no-build-isolation .
      - name: Install from public tag and run native wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:RUNNER_TEMP/cds-verifier/Scripts/python.exe" -I -B ci/qualify_installed_release.py --public-windows-source "$env:RUNNER_TEMP/cds-public-tag" --root "$env:RUNNER_TEMP/cds-install" --evidence "$env:RUNNER_TEMP/cds-public-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-public-install-${{ env.RELEASE_TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cds-public-evidence/
          if-no-files-found: error
          retention-days: 14
