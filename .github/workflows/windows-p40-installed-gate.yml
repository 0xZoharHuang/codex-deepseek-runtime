name: Windows 2025 P40 reviewed installed IPC
on:
  push:
    branches: ['codex/windows-p40-installed-gate-r605']
    paths: ['.github/workflows/windows-p40-installed-gate.yml', 'ci/windows_p40_installed_gate.py']
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed v0.7.1 production commit
        required: true
        type: string
      manifest_sha256:
        description: Exact reviewed default Windows manifest SHA-256
        required: true
        type: string
      source_id:
        description: Exact reviewed installer source ID
        required: true
        type: string
      archive_asset_id:
        description: GitHub release asset ID of the verified P40 archive
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cds-p40-installed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  register:
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-2025
    timeout-minutes: 2
    steps:
      - shell: pwsh
        run: Write-Output "Dispatch this test-only workflow with the reviewed source and asset pins."
  draft-asset:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == '0xZoharHuang/codex-deepseek-runtime' && github.ref == 'refs/heads/codex/windows-p40-installed-gate-r605' && inputs.archive_asset_id == '719954798' }}
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: GET fixed draft asset and verify exact bytes
        shell: pwsh
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $PSVersionTable.PSVersion -lt [version]'7.4') {
            throw 'A disposable hosted Windows runner with byte-preserving PowerShell redirection is required.'
          }
          $part = Join-Path $env:RUNNER_TEMP 'cds-p40-verified.part'
          $archive = Join-Path $env:RUNNER_TEMP 'cds-p40-verified.tar.gz'
          $stderr = Join-Path $env:RUNNER_TEMP 'cds-p40-draft-get.stderr'
          & gh api --hostname github.com --method GET -H 'Accept: application/octet-stream' '/repos/0xZoharHuang/codex-deepseek-runtime/releases/assets/719954798' > $part 2> $stderr
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            $match = [regex]::Match([string](Get-Content -Raw -LiteralPath $stderr), '\bHTTP\s+(\d{3})\b')
            $http = if ($match.Success) { $match.Groups[1].Value } else { 'unavailable' }
            throw "Draft GET failed (gh exit $exit, HTTP $http)."
          }
          $bytes = (Get-Item -LiteralPath $part).Length
          $sha = (Get-FileHash -LiteralPath $part -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bytes -ne 204367729 -or $sha -ne 'd9b8d73184bfac47842505c8e540d132ebb564d443b0ad55722d7583a8bde418') {
            throw 'Draft GET body differs from the verified P40 archive.'
          }
          Move-Item -LiteralPath $part -Destination $archive
          Write-Output "Verified draft asset 719954798: $bytes bytes, SHA256 $sha."
      - name: Hand off one verified file to the same run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cds-p40-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cds-p40-verified.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  qualify:
    needs: draft-asset
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/windows-p40-installed-gate-r605' }}
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      RELEASE_SOURCE_ID: ${{ inputs.source_id }}
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.3"
          architecture: x64
      - name: Checkout reviewed source anonymously at exact commit
        shell: pwsh
        run: python -I -B ci/windows_p40_installed_gate.py prepare
      - name: Fetch the same-run verified P40 file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cds-p40-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cds-p40-input
      - name: Normal install and original strict no-model IPC and EOF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv "$env:RUNNER_TEMP/cds-p40-verifier"
          $python = "$env:RUNNER_TEMP/cds-p40-verifier/Scripts/python.exe"
          & $python -I -m pip install --only-binary=:all: --require-hashes -r "$env:RUNNER_TEMP/cds-p40-reviewed/requirements.lock"
          & $python -I -B ci/windows_p40_installed_gate.py qualify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cds-windows2025-p40-installed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cds-p40-evidence/
          if-no-files-found: warn
          retention-days: 14
